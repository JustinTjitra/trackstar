<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>Trackstar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap"
    />
  </head>
  <body>
    <main id="app">
      <video id="video" playsinline muted></video>
      <canvas id="stage" aria-label="Camera view with hand tracking"></canvas>

      <div id="status" class="status-pill" role="status"></div>
      <button id="settings-btn" class="icon-btn" type="button" aria-label="Settings (S)" title="Settings (S)">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
          <path
            fill="currentColor"
            d="M19.4 13a7.7 7.7 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.6 7.6 0 0 0-1.7-1L15 3h-4l-.4 2.7a7.6 7.6 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.7 7.7 0 0 0 0 2l-2.2 1.6 2 3.5 2.5-1c.5.4 1.1.7 1.7 1L11 21h4l.4-2.7c.6-.3 1.2-.6 1.7-1l2.5 1 2-3.5zM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z"
            transform="translate(-1 0)"
          />
        </svg>
      </button>
      <div id="banner" class="banner" role="alert" hidden></div>

      <section id="console" class="console" aria-label="Deck state"></section>
      <aside id="settings" class="drawer" aria-label="Settings" hidden></aside>
      <section id="sheet" class="sheet" hidden></section>
      <div id="recorder" class="recorder" hidden></div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
